# Python side of the app: the agent team served by the Vercel function in api/agents/index.py.
# The Next.js app does not use this file.
[project]
name = "business-os-agents"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "crewai==1.15.35",
  "fastapi>=0.115",
  "httpx>=0.27",
]

[tool.uv]
# CrewAI pulls in vector stores, PDF parsing and a Kubernetes client that the team never uses. Leaving them out
# keeps the function well under Vercel's size limit (an impossible marker drops a dependency).
override-dependencies = [
  "kubernetes; sys_platform == 'never'",
  "onnxruntime; sys_platform == 'never'",
  "grpcio; sys_platform == 'never'",
  "lancedb; sys_platform == 'never'",
  "pyarrow; sys_platform == 'never'",
  "pdfplumber; sys_platform == 'never'",
]
